server:
  port: 8080
  address: 0.0.0.0

spring:
  kafka:
#    bootstrap-servers: dev.pcanabarro.com:39092
    bootstrap-servers: localhost:29092
    consumer:
      group-id: etl-group
      auto-offset-reset: earliest
    listener:
      concurrency: 3

  datasource:
#    url: jdbc:postgresql://dev.pcanabarro.com:5432/destination_db
    url: jdbc:postgresql://localhost:5432/destination_db
    username: app_admin
#    password: ServerChacara@Root098!
    password: Root@Passord123
    driver-class-name: org.postgresql.Driver

etl:
  kafka:
    topic: etl-topic
    group-id: etl-group

management:
  metrics:
    distribution:
      percentiles-histogram:
        all: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
